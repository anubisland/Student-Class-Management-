name: Test & Coverage

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/test-coverage.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/test-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
          JEST_JUNIT_OUTPUT_NAME: junit.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: mobile-app/coverage
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: mobile-app/reports
          retention-days: 30

      - name: Generate coverage summary
        id: coverage
        run: |
          # Parse coverage summary from Jest output
          COVERAGE_FILE="coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            STATEMENTS=$(jq '.total.statements.pct' "$COVERAGE_FILE")
            BRANCHES=$(jq '.total.branches.pct' "$COVERAGE_FILE")
            FUNCTIONS=$(jq '.total.functions.pct' "$COVERAGE_FILE")
            LINES=$(jq '.total.lines.pct' "$COVERAGE_FILE")

            echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT
            echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
            echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
            echo "lines=$LINES" >> $GITHUB_OUTPUT
          fi

      - name: Create coverage report comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          script: |
            const statements = '${{ steps.coverage.outputs.statements }}' || 'N/A';
            const branches = '${{ steps.coverage.outputs.branches }}' || 'N/A';
            const functions = '${{ steps.coverage.outputs.functions }}' || 'N/A';
            const lines = '${{ steps.coverage.outputs.lines }}' || 'N/A';

            const getEmoji = (pct) => {
              const num = parseFloat(pct);
              if (isNaN(num)) return '❓';
              if (num >= 80) return '✅';
              if (num >= 60) return '⚠️';
              return '❌';
            };

            const body = `## 📊 Test Coverage Report

            | Metric | Coverage | Status |
            |--------|----------|--------|
            | Statements | ${statements}% | ${getEmoji(statements)} |
            | Branches | ${branches}% | ${getEmoji(branches)} |
            | Functions | ${functions}% | ${getEmoji(functions)} |
            | Lines | ${lines}% | ${getEmoji(lines)} |

            > Coverage threshold: 80%

            📁 [Download full coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Add job summary
        run: |
          echo "## 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          COVERAGE_FILE="coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            STATEMENTS=$(jq '.total.statements.pct' "$COVERAGE_FILE")
            BRANCHES=$(jq '.total.branches.pct' "$COVERAGE_FILE")
            FUNCTIONS=$(jq '.total.functions.pct' "$COVERAGE_FILE")
            LINES=$(jq '.total.lines.pct' "$COVERAGE_FILE")

            get_status() {
              if (( $(echo "$1 >= 80" | bc -l) )); then
                echo "✅ Pass"
              else
                echo "❌ Fail"
              fi
            }

            echo "| Statements | ${STATEMENTS}% | 80% | $(get_status $STATEMENTS) |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${BRANCHES}% | 80% | $(get_status $BRANCHES) |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${FUNCTIONS}% | 80% | $(get_status $FUNCTIONS) |" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | ${LINES}% | 80% | $(get_status $LINES) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage summary file not found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Files Covered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ -f "$COVERAGE_FILE" ]; then
            jq -r 'to_entries | .[] | select(.key != "total") | "\(.key): \(.value.lines.pct)% lines"' "$COVERAGE_FILE" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Generated by [Test & Coverage Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_" >> $GITHUB_STEP_SUMMARY

      - name: Check coverage thresholds
        run: |
          COVERAGE_FILE="coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            STATEMENTS=$(jq '.total.statements.pct' "$COVERAGE_FILE")
            BRANCHES=$(jq '.total.branches.pct' "$COVERAGE_FILE")
            FUNCTIONS=$(jq '.total.functions.pct' "$COVERAGE_FILE")
            LINES=$(jq '.total.lines.pct' "$COVERAGE_FILE")

            THRESHOLD=80
            FAILED=0

            if (( $(echo "$STATEMENTS < $THRESHOLD" | bc -l) )); then
              echo "❌ Statements coverage ($STATEMENTS%) is below threshold ($THRESHOLD%)"
              FAILED=1
            fi

            if (( $(echo "$BRANCHES < $THRESHOLD" | bc -l) )); then
              echo "❌ Branches coverage ($BRANCHES%) is below threshold ($THRESHOLD%)"
              FAILED=1
            fi

            if (( $(echo "$FUNCTIONS < $THRESHOLD" | bc -l) )); then
              echo "❌ Functions coverage ($FUNCTIONS%) is below threshold ($THRESHOLD%)"
              FAILED=1
            fi

            if (( $(echo "$LINES < $THRESHOLD" | bc -l) )); then
              echo "❌ Lines coverage ($LINES%) is below threshold ($THRESHOLD%)"
              FAILED=1
            fi

            if [ $FAILED -eq 1 ]; then
              echo ""
              echo "Coverage thresholds not met. Please add more tests."
              exit 1
            fi

            echo "✅ All coverage thresholds met!"
          fi
