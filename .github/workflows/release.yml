name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual release'
        required: false
        default: 'Scheduled 2-day cadence release'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install npm dependencies
        working-directory: mobile-app
        run: npm install

      - name: Make gradlew executable
        working-directory: mobile-app/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-class-management-apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: student-class-management-apk
          path: ./artifacts

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=Student Class Management ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            DATE=$(date +'%Y%m%d-%H%M')
            SHORT_SHA=${GITHUB_SHA::7}
            echo "tag=v${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "name=Student Class Management ${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          body: |
            ## Student Class Management Release ${{ steps.tag.outputs.tag }}

            Automated release from ${{ github.ref_name }} (commit ${{ github.sha }})

            ### Artifacts
            - **Android APK**: app-release.apk

            ### Installation
            Download `app-release.apk` and install on your Android device.
            Enable "Install from unknown sources" in device settings if prompted.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/app-release.apk
