<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Calendar Surface Gradient -->
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Calendar Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Decorative subtle background ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.15"/>
  <circle cx="430" cy="80" r="140" fill="#60A5FA" fill-opacity="0.18"/>
  <circle cx="80" cy="440" r="100" fill="#1E40AF" fill-opacity="0.3"/>

  <!-- Main Calendar Board -->
  <g filter="url(#shadow)">
    <!-- Calendar Body -->
    <rect x="86" y="96" width="340" height="330" rx="36" fill="url(#calGrad)"/>

    <!-- Calendar Red Header -->
    <path d="M86 132 C86 112, 102 96, 122 96 L390 96 C410 96, 426 112, 426 132 L426 172 L86 172 Z" fill="url(#headerGrad)"/>

    <!-- Calendar Binder Rings -->
    <rect x="150" y="74" width="24" height="44" rx="12" fill="#CBD5E1" filter="url(#softShadow)"/>
    <rect x="154" y="74" width="16" height="44" rx="8" fill="#F8FAFC"/>
    <rect x="338" y="74" width="24" height="44" rx="12" fill="#CBD5E1" filter="url(#softShadow)"/>
    <rect x="342" y="74" width="16" height="44" rx="8" fill="#F8FAFC"/>

    <!-- Calendar Header Dots -->
    <circle cx="236" cy="134" r="6" fill="#FFFFFF" fill-opacity="0.8"/>
    <circle cx="256" cy="134" r="6" fill="#FFFFFF" fill-opacity="0.8"/>
    <circle cx="276" cy="134" r="6" fill="#FFFFFF" fill-opacity="0.8"/>

    <!-- Three Kids / Students Representation Badges inside Calendar -->
    <!-- Child 1 (Blue - Boy/Scholar) -->
    <g transform="translate(136, 210)" filter="url(#softShadow)">
      <circle cx="36" cy="36" r="32" fill="#3B82F6"/>
      <circle cx="36" cy="26" r="12" fill="#FFFFFF"/>
      <path d="M18 54 C18 42, 54 42, 54 54" fill="#FFFFFF"/>
    </g>

    <!-- Child 2 (Pink - Girl) -->
    <g transform="translate(220, 210)" filter="url(#softShadow)">
      <circle cx="36" cy="36" r="32" fill="#EC4899"/>
      <circle cx="36" cy="26" r="12" fill="#FFFFFF"/>
      <path d="M18 54 C18 42, 54 42, 54 54" fill="#FFFFFF"/>
    </g>

    <!-- Child 3 (Emerald - Kid) -->
    <g transform="translate(304, 210)" filter="url(#softShadow)">
      <circle cx="36" cy="36" r="32" fill="#10B981"/>
      <circle cx="36" cy="26" r="12" fill="#FFFFFF"/>
      <path d="M18 54 C18 42, 54 42, 54 54" fill="#FFFFFF"/>
    </g>

    <!-- Activity & Schedule Lines -->
    <!-- Row 1 -->
    <rect x="136" y="296" width="160" height="14" rx="7" fill="#94A3B8" fill-opacity="0.4"/>
    <rect x="312" y="296" width="64" height="14" rx="7" fill="#3B82F6" fill-opacity="0.3"/>

    <!-- Row 2 -->
    <rect x="136" y="324" width="120" height="14" rx="7" fill="#94A3B8" fill-opacity="0.4"/>
    <rect x="272" y="324" width="104" height="14" rx="7" fill="#10B981" fill-opacity="0.3"/>

    <!-- Row 3 -->
    <rect x="136" y="352" width="144" height="14" rx="7" fill="#94A3B8" fill-opacity="0.4"/>
    <rect x="296" y="352" width="80" height="14" rx="7" fill="#EC4899" fill-opacity="0.3"/>
  </g>

  <!-- Floating Achievement / Payment Coin Badge at bottom right -->
  <g transform="translate(330, 320)" filter="url(#shadow)">
    <circle cx="64" cy="64" r="54" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Currency / Checkmark Symbol -->
    <path d="M42 66 L58 82 L90 48" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle details -->
  <path d="M110 90 L115 75 L120 90 L135 95 L120 100 L115 115 L110 100 L95 95 Z" fill="#FDE047"/>
  <path d="M410 240 L413 230 L416 240 L426 243 L416 246 L413 256 L410 246 L400 243 Z" fill="#FFFFFF" fill-opacity="0.8"/>
</svg>
